<style>
:root{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --side:#141416;
  --fill:rgba(120,120,128,.20); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(120,120,128,.45);
  --sep:rgba(84,84,88,.55);
  --text:#FFFFFF; --text-2:rgba(235,235,245,.62); --text-3:rgba(235,235,245,.48);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --indigo:#5E5CE6; --pink:#FF375F; --teal:#40C8E0; --purple:#BF5AF2;
  --blue-soft:rgba(10,132,255,.16);
  --heat-1:rgba(10,132,255,.22); --heat-1t:rgba(235,235,245,.85);
  --heat-2:rgba(10,132,255,.42); --heat-3:rgba(10,132,255,.68);
  --bar:rgba(18,18,20,.82);
  --r:12px; --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#FFFFFF; --side:#FFFFFF;
  --fill:rgba(120,120,128,.10); --fill-2:rgba(120,120,128,.18); --fill-3:rgba(120,120,128,.28);
  --sep:rgba(60,60,67,.14);
  --text:#000000; --text-2:rgba(60,60,67,.60); --text-3:rgba(60,60,67,.46);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9F0A;
  --indigo:#5E5CE6; --pink:#FF375F; --teal:#30B0C7; --purple:#AF52DE;
  --blue-soft:rgba(0,122,255,.10);
  --heat-1:rgba(0,122,255,.16); --heat-1t:#0A5FBF;
  --heat-2:rgba(0,122,255,.40); --heat-3:rgba(0,122,255,.72);
  --bar:rgba(249,249,249,.88);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  transition:background .25s,color .25s;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--blue);text-decoration:none}
svg{display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

[hidden]{display:none !important}

/* ---------- 登录 ---------- */
#login-view{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 24px calc(28px + var(--safe-b))}
.login-brand{width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,var(--blue),#0B5FD0);
  display:grid;place-items:center;color:#fff;margin-bottom:22px}
.login-h{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:0 0 8px}
.login-p{color:var(--text-2);font-size:15px;margin:0 0 28px;line-height:1.55}
.login-card{background:var(--card);border-radius:16px;padding:4px 0;margin-bottom:14px}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:50px;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:500;margin-bottom:12px}
.btn-primary:active{opacity:.82}
.btn-primary:disabled{opacity:.5}
.btn-ghost{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:12px;
  background:var(--fill);color:var(--text);font-size:16px}
.login-note{color:var(--text-3);font-size:12.5px;line-height:1.6;margin-top:18px;text-align:center}
.field{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.field:last-child{border-bottom:0}
.field input{flex:1;border:0;background:none;color:var(--text);outline:none;min-width:0}
.field input::placeholder{color:var(--text-3)}
.field .send{color:var(--blue);font-size:14px;white-space:nowrap;font-weight:500}
.field .send:disabled{color:var(--text-3)}
.err{color:var(--red);font-size:13px;margin:10px 4px 0;line-height:1.5}

/* ---------- 主框架 ---------- */
#main{min-height:100dvh}
.navbar{position:sticky;top:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
.navbar.scrolled{border-bottom-color:var(--sep)}
.navbar-in{max-width:760px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.navbar h1{font-size:19px;font-weight:500;letter-spacing:-.01em;margin:0;opacity:0;transition:opacity .2s}
.navbar.scrolled h1{opacity:1}
.navbar .right{display:flex;gap:6px;align-items:center;margin-left:auto}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--fill)}
.iconbtn:active{opacity:.6}

.content{max-width:760px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
.head{padding:6px 0 14px}
.head .date{color:var(--text-2);font-size:13px;margin-bottom:2px}
.head h2{font-size:32px;font-weight:500;letter-spacing:-.025em;margin:0;line-height:1.15}

.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.gtitle{font-size:13px;color:var(--text-2);margin:22px 4px 8px;font-weight:400}
.gfoot{font-size:12px;color:var(--text-3);margin:8px 4px 0;line-height:1.5}

/* ---------- 今日 ---------- */
.hero{background:var(--card);border-radius:16px;padding:18px 18px 16px;display:flex;gap:16px;align-items:center}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .val b{font-size:21px;font-weight:500;letter-spacing:-.02em}
.ring .val i{font-size:10.5px;color:var(--text-2);font-style:normal;margin-top:1px}
.hero-txt{flex:1;min-width:0}
.hero-txt .t{font-size:16px;font-weight:500;margin-bottom:3px}
.hero-txt .s{font-size:13px;color:var(--text-2);line-height:1.45}

.health{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--card);border-radius:var(--r);margin-top:12px;overflow:hidden}
.hcell{padding:12px 6px;text-align:center;border-right:.5px solid var(--sep)}
.hcell:last-child{border-right:0}
.hcell .k{font-size:11px;color:var(--text-2);margin-bottom:3px;white-space:nowrap}
.hcell .v{font-size:17px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.hcell .u{font-size:10.5px;color:var(--text-3);font-weight:400;margin-left:1px}
.hcell.empty .v{color:var(--text-3);font-size:14px;font-weight:400}

/* 列表行 */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--sep);background:var(--card);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--fill)}
.licon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.lbody{flex:1;min-width:0}
.lrow-t{font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow-sub{font-size:12.5px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--fill-3);flex:none;display:grid;place-items:center;color:#fff}
.chk.on{background:var(--green);border-color:var(--green)}
.lrow.done .lrow-t{color:var(--text-2)}
.lrow.done .lrow-sub{color:var(--text-3)}
.minus{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.addrow{display:flex;align-items:center;gap:10px;padding:13px 14px;color:var(--blue);font-size:15px;cursor:pointer;background:var(--card)}
.addrow:active{background:var(--fill)}

/* 在读 */
.rail{display:flex;gap:13px;overflow-x:auto;padding:14px 14px 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.bk{width:86px;flex:none;cursor:pointer}
.bk:active{transform:scale(.97)}
.bk-cover{position:relative;width:100%;aspect-ratio:3/4.35;border-radius:4px;overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.42),0 0 0 .5px rgba(255,255,255,.10);
  display:flex;align-items:flex-start;padding:12px 10px}
.bk-cover span{font-size:11.5px;line-height:1.25;color:#fff;font-weight:500;
  text-shadow:0 1px 3px rgba(0,0,0,.35);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bk-cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(90deg,rgba(0,0,0,.30),transparent)}
.bk-t{font-size:12.5px;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk-a{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 分段控件 */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 14px}
.seg button{flex:1;padding:6px 0;font-size:13px;border-radius:7px;color:var(--text);transition:background .15s}
.seg button.on{background:#636366;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.5)}
:root[data-theme="light"] .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* 书架 */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px}
@media(min-width:560px){.shelf{grid-template-columns:repeat(4,1fr)}}

/* 日历 */
.cal{background:var(--card);border-radius:var(--r);padding:12px 10px 14px}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.cal-top .m{font-size:16px;font-weight:500}
.cal-nav{display:flex;gap:2px}
.cal-nav button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text-2)}
.cal-nav button:active{background:var(--fill)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.wk div{text-align:center;font-size:11px;color:var(--text-3)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;border-radius:8px;background:var(--fill);display:grid;place-items:center;
  font-size:12px;color:var(--text-2);cursor:pointer;position:relative}
.cal-cell:active{transform:scale(.94)}
.cal-cell.out{opacity:.28;cursor:default}
.cal-cell.today{font-weight:600}
.cal-cell.today::after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.85}
.cal-cell.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--blue)}
.cal-cell.l1{background:var(--heat-1);color:var(--heat-1t)}
.cal-cell.l2{background:var(--heat-2);color:#fff}
.cal-cell.l3{background:var(--heat-3);color:#fff}
.cal-cell.l4{background:var(--blue);color:#fff;font-weight:600}
.legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--text-3)}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* 学习 */
.plan{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.plan-t{font-size:16px;font-weight:500}
.plan-s{font-size:12.5px;color:var(--text-2);margin-top:2px}
.plan-pct{font-size:22px;font-weight:500;letter-spacing:-.03em;color:var(--blue)}
.bar{height:6px;border-radius:3px;background:var(--fill);margin:12px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .3s}
.plan-foot{display:flex;align-items:center;justify-content:space-between}
.plan-foot .w{font-size:12px;color:var(--text-2)}
.pill{font-size:13px;padding:6px 14px;border-radius:20px;background:var(--blue-soft);color:var(--blue);font-weight:500}
.pill:active{opacity:.6}

/* 趋势 */
.metric{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric .mcell.wide{grid-column:1/-1}
.mcell{background:var(--card);border-radius:var(--r);padding:13px 14px}
.mcell .k{font-size:12px;color:var(--text-2)}
.mcell .v{font-size:23px;font-weight:500;letter-spacing:-.025em;margin-top:2px}
.mcell .d{font-size:11.5px;color:var(--text-3);margin-top:1px}
.chartcard{background:var(--card);border-radius:var(--r);padding:14px 10px 10px;margin-top:12px}
.chart-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}
.chart-head .t{font-size:14px;font-weight:500}
.chart-head .lg{display:flex;gap:10px;font-size:11px;color:var(--text-2)}
.chart-head .lg span{display:flex;align-items:center;gap:4px}
.chart-head .lg i{width:8px;height:8px;border-radius:2px;display:block}
.chartwrap{width:100%;overflow:visible}

/* 我的 */
.profile{display:flex;align-items:center;gap:13px;padding:16px 14px}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-size:19px;font-weight:500;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile .n{font-size:17px;font-weight:500}
.profile .e{font-size:12.5px;color:var(--text-2);margin-top:2px;word-break:break-all}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--text-3)}
.chev{color:var(--text-3);flex:none}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill-2);position:relative;flex:none;transition:background .22s;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform .22s cubic-bezier(.32,.72,0,1)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.danger{color:var(--red)}
.btnblock.danger{color:var(--red)}

/* 底部标签栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:var(--safe-b)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--text-3)}
.tab.on{color:var(--blue)}
.tab span{font-size:10.5px;letter-spacing:0}

/* 弹层 */
.mask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;background:var(--bg);border-radius:14px 14px 0 0;
  max-height:88dvh;overflow-y:auto;transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(12px + var(--safe-b))}
.mask.on .sheet{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill-3);margin:8px auto 4px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 12px}
.sheet-h .t{font-size:17px;font-weight:500}
.sheet-h button{color:var(--blue);font-size:15px}
.sheet-body{padding:0 16px 8px}
.sheet .card{background:var(--card2)}
.sheet textarea,.sheet input[type=text],.sheet input[type=number],.sheet select{
  width:100%;border:0;background:var(--card2);color:var(--text);border-radius:10px;padding:12px 14px;outline:none;
  -webkit-appearance:none;appearance:none}
.sheet textarea{resize:vertical;min-height:88px;line-height:1.55;font-size:14px}
.sheet select{background-image:none}
.sheet .lbl{font-size:13px;color:var(--text-2);margin:14px 4px 7px}
.rowbtn{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:.5px solid var(--sep);width:100%;text-align:left}
.rowbtn:last-child{border-bottom:0}
.rowbtn:active{background:var(--fill)}
.rowbtn .rb-t{font-size:15.5px}
.rowbtn .rb-s{font-size:12.5px;color:var(--text-2);margin-top:1px}
.icbox{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.btnblock{display:block;width:100%;padding:14px;border-radius:12px;text-align:center;font-size:16px;font-weight:500}
.btnblock.blue{background:var(--blue);color:#fff}
.btnblock.gray{background:var(--card2);color:var(--text)}
.btnblock.red{background:var(--red);color:#fff}
.btnblock:active{opacity:.82}
.picks{display:flex;flex-wrap:wrap;gap:9px;padding:2px 2px}
.pick{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid transparent}
.pick.on{border-color:var(--text)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--text)}

/* 划线卡 */
.note{background:var(--card2);border-radius:10px;padding:12px 12px 16px;margin-bottom:9px;position:relative}
.note .ch{font-size:11.5px;color:var(--text-3);margin-bottom:5px}
.note .tx{font-size:13.5px;line-height:1.62;padding-left:9px;border-left:2px solid var(--blue)}
.note .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;
  background:var(--fill-2);color:var(--text-2);display:grid;place-items:center}
.note .x:active{background:var(--fill-3)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,10px);
  z-index:90;background:#2C2C2E;color:#fff;border:.5px solid rgba(255,255,255,.12);
  padding:10px 16px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;max-width:86vw;text-align:center;line-height:1.45}
#toast.on{opacity:1;transform:translate(-50%,0)}
:root[data-theme="light"] #toast{background:rgba(28,28,30,.94);color:#fff}

.empty{padding:36px 16px;text-align:center;color:var(--text-3);font-size:13.5px;line-height:1.6}
.spin{width:20px;height:20px;border-radius:50%;border:2px solid var(--fill-3);border-top-color:var(--blue);
  animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* 桌面端 */
@media(min-width:900px){
  #main{display:flex}
  .sidebar{width:230px;flex:none;background:var(--side);border-right:.5px solid var(--sep);
    position:fixed;top:0;bottom:0;left:0;padding:22px 12px;display:flex;flex-direction:column;z-index:25}
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
  .side-brand .lg{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,var(--blue),#0B5FD0);display:grid;place-items:center;color:#fff}
  .side-brand .nm{font-size:14.5px;font-weight:500}
  .snav{display:flex;flex-direction:column;gap:2px}
  .snav button{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--text-2);font-size:14px}
  .snav button.on{background:var(--fill);color:var(--text);font-weight:500}
  .snav button:active{background:var(--fill)}
  .main-col{flex:1;margin-left:230px;min-width:0}
  .tabbar{display:none}
  .content{padding-bottom:60px}
  .login-wrap{max-width:420px;margin:0 auto}
}
@media(max-width:899px){.sidebar{display:none}}

/* ---------- 加载骨架屏 ---------- */
.sk-wrap{padding:6px 0 14px}
.sk-line{height:13px;border-radius:6px;background:var(--fill);margin:0 4px 10px}
.sk-card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sk-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.sk-dot{width:30px;height:30px;border-radius:8px;background:var(--fill);flex:none}
.sk-bar{height:12px;border-radius:6px;background:var(--fill)}
.sk-anim{background:linear-gradient(90deg,var(--fill) 25%,var(--fill-2) 50%,var(--fill) 75%);
  background-size:200% 100%;animation:skMove 1.3s linear infinite}
@keyframes skMove{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- 离线条 ---------- */
.offline-bar{background:var(--orange);color:#1c1000;font-size:12.5px;line-height:1.5;
  padding:7px 16px;text-align:center}

/* ---------- iOS 风格确认弹层 ---------- */
.amask{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;
  align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.amask.on{opacity:1;pointer-events:auto}
.asheet{width:100%;max-width:520px;padding:0 10px calc(10px + var(--safe-b));
  transform:translateY(18px);transition:transform .22s cubic-bezier(.32,.72,0,1)}
.amask.on .asheet{transform:none}
.a-box{background:var(--card2);border-radius:14px;overflow:hidden;text-align:center;padding:18px 18px 10px}
.a-title{font-size:16px;font-weight:600;margin-bottom:5px}
.a-msg{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:16px}
.a-btn{display:block;width:100%;border-radius:11px;padding:13px;font-size:16px;font-weight:500}
.a-btn.danger{background:var(--red);color:#fff}
.a-btn.blue{background:var(--blue);color:#fff}
.a-btn.cancel{background:var(--card);color:var(--blue);margin-top:8px}
.a-btn:active{opacity:.8}
#btn-me.on{color:var(--blue);background:var(--blue-soft)}
.snav .side-sep{height:1px;background:var(--sep);margin:10px 8px}
</style>
</head>
<body>

<div id="login-view" hidden>
  <div class="login-wrap">
    <div class="login-brand">
      <svg width="30" height="30" viewBox="0 0 24 24" class="ic" style="stroke-width:1.8"><path d="M3 7h18M3 12h18M3 17h11"/></svg>
    </div>
    <h1 class="login-h">生活记录</h1>
    <p class="login-p">打卡、阅读、学习与身体数据，一个面板全部收好。</p>

    <button class="btn-primary" id="btn-wb-login">
      <svg width="18" height="18" viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2"/></svg>
      使用 WorkBuddy 登录
    </button>

    <div class="login-card">
      <div class="field">
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="邮箱地址">
      </div>
      <div class="field">
        <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="验证码" maxlength="6">
        <button class="send" id="btn-send-otp" type="button">获取验证码</button>
      </div>
    </div>
    <button class="btn-ghost" id="btn-otp-login">登录 / 注册</button>

    <div class="err" id="login-err" hidden></div>
    <p class="login-note">数据保存在你的云端账户中，手机与桌面登录同一账号即可同步。</p>
  </div>
</div>

<div id="main" hidden>
  <aside class="sidebar">
    <div class="side-brand">
      <div class="lg"><svg width="17" height="17" viewBox="0 0 24 24" class="ic"><path d="M3 7h18M3 12h18M3 17h11"/></svg></div>
      <div class="nm">生活记录</div>
    </div>
    <nav class="snav" id="snav"></nav>
  </aside>

  <div class="main-col">
    <header class="navbar" id="navbar">
      <div class="navbar-in">
        <h1 id="nav-title">今日</h1>
        <div class="right">
          <button class="iconbtn" id="btn-me" data-act="tab" data-id="me" title="我的">
            <svg width="17" height="17" viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8" r="3.6"/><path d="M4.6 20.2c0-3.7 3.3-5.7 7.4-5.7s7.4 2 7.4 5.7"/></svg>
          </button>
          <button class="iconbtn" id="btn-theme" data-act="theme" title="切换外观">
            <svg width="17" height="17" viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="offline-bar" id="offline-bar" hidden>离线模式 · 正在显示本机缓存数据，联网后自动同步</div>

    <div class="content">
      <section id="view-today"></section>
      <section id="view-calendar" hidden></section>
      <section id="view-reading" hidden></section>
      <section id="view-study" hidden></section>
      <section id="view-trend" hidden></section>
      <section id="view-me" hidden></section>
    </div>

    <nav class="tabbar">
      <div class="tabbar-in" id="tabbar"></div>
    </nav>
  </div>
</div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="amask" id="confirm-mask">
  <div class="asheet">
    <div class="a-box">
      <div class="a-title" id="a-title">确认操作</div>
      <div class="a-msg" id="a-msg"></div>
      <button class="a-btn danger" id="a-ok">删除</button>
    </div>
    <button class="a-btn cancel" id="a-cancel">取消</button>
  </div>
</div>
<input type="file" id="backup-file" accept=".json,application/json" hidden>
<div id="toast"></div>

<script>
/* COROS 数据接入：OAuth 2.0 + PKCE，直连官方 MCP（已确认允许本域跨域） */
(function () {
'use strict';

const CFG = window.APP_CONFIG.coros;
const KV_KEY = 'coros_auth';
const CLIENT_KEY = 'lifeboard.coros.client';
const VERIFIER_KEY = 'lifeboard.coros.verifier';
const STATE_KEY = 'lifeboard.coros.state';

let cache = null;          // { access_token, refresh_token, expires_at, client_id, last_sync }
let loaded = false;
let busy = false;

/* ---------- 小工具 ---------- */
function b64url(buf) {
  let s = btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  return s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function rand(n) {
  const a = new Uint8Array(n);
  crypto.getRandomValues(a);
  return b64url(a.buffer);
}
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return b64url(buf);
}
function form(obj) {
  return Object.keys(obj).filter(k => obj[k] !== undefined && obj[k] !== null)
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(obj[k])).join('&');
}
const isToday = s => {
  const d = new Date();
  const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return s === k;
};
function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function redirectUri() {
  try {
    if (window.LifeApp && typeof window.LifeApp.appBase === 'function') return window.LifeApp.appBase();
  } catch (e) {}
  return CFG.redirectUri;
}

/* ---------- 客户端注册 ---------- */
async function ensureClientId() {
  try {
    const raw = localStorage.getItem(CLIENT_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && o.client_id && o.redirect_uri === redirectUri()) return o.client_id;
    }
  } catch (e) {}

  const res = await fetch(CFG.base + '/connect/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      client_name: CFG.clientName,
      redirect_uris: [redirectUri()],
      grant_types: ['authorization_code', 'refresh_token'],
      response_types: ['code'],
      token_endpoint_auth_method: 'none'
    })
  });
  if (!res.ok) throw new Error('注册应用失败（' + res.status + '）');
  const data = await res.json();
  localStorage.setItem(CLIENT_KEY, JSON.stringify({ client_id: data.client_id, redirect_uri: redirectUri() }));
  return data.client_id;
}

/* ---------- 授权 ---------- */
async function connect() {
  if (busy) return;
  busy = true;
  try {
    const clientId = await ensureClientId();
    const verifier = rand(48);
    const challenge = await sha256(verifier);
    const state = 'coros_' + rand(12);
    sessionStorage.setItem(VERIFIER_KEY, verifier);
    sessionStorage.setItem(STATE_KEY, state);

    const p = new URLSearchParams({
      response_type: 'code',
      client_id: clientId,
      redirect_uri: redirectUri(),
      scope: 'openid mcp.tools offline_access',
      state: state,
      code_challenge: challenge,
      code_challenge_method: 'S256',
      resource: CFG.base
    });
    location.assign(CFG.base + '/oauth2/authorize?' + p.toString());
  } catch (e) {
    window.LifeApp.toast('无法发起授权：' + (e.message || ''));
    busy = false;
  }
}

async function handleCallback(url) {
  const code = url.searchParams.get('code');
  const state = url.searchParams.get('state') || '';
  const err = url.searchParams.get('error');
  if (err) throw new Error(url.searchParams.get('error_description') || err);
  if (!code) throw new Error('授权回调缺少 code');

  const saved = sessionStorage.getItem(STATE_KEY);
  if (saved && state !== saved) throw new Error('授权状态不匹配，请重新授权');

  const verifier = sessionStorage.getItem(VERIFIER_KEY);
  if (!verifier) throw new Error('本地授权凭据已失效，请重新点「连接 COROS」');

  const clientRaw = localStorage.getItem(CLIENT_KEY);
  const clientId = clientRaw ? JSON.parse(clientRaw).client_id : null;
  if (!clientId) throw new Error('未找到应用注册信息，请重新授权');

  const res = await fetch(CFG.base + '/oauth2/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: form({
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: redirectUri(),
      client_id: clientId,
      code_verifier: verifier,
      resource: CFG.base
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.access_token) {
    throw new Error('换取令牌失败：' + (data.error_description || data.error || res.status));
  }
  await persist(data, clientId);
  sessionStorage.removeItem(VERIFIER_KEY);
  sessionStorage.removeItem(STATE_KEY);
  window.LifeApp.toast('COROS 已连接');
}

/* ---------- 令牌管理 ---------- */
async function persist(tok, clientId) {
  cache = {
    access_token: tok.access_token,
    refresh_token: tok.refresh_token || (cache && cache.refresh_token) || null,
    expires_at: Date.now() + (Number(tok.expires_in || 3600) * 1000),
    client_id: clientId,
    last_sync: (cache && cache.last_sync) || null
  };
  loaded = true;
  await window.LifeApp.saveKv(KV_KEY, cache);
}

async function loadAuth() {
  if (loaded) return cache;
  loaded = true;
  try {
    const v = await window.LifeApp.getKv(KV_KEY);
    if (v && v.access_token) cache = v;
  } catch (e) { console.warn('[coros] load auth', e); }
  return cache;
}

async function ensureFresh() {
  const a = await loadAuth();
  if (!a || !a.access_token) throw new Error('还没有连接 COROS');
  if (Date.now() < (a.expires_at || 0) - 60000) return a;
  if (!a.refresh_token) throw new Error('授权已过期，请重新连接 COROS');

  const res = await fetch(CFG.base + '/oauth2/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: form({
      grant_type: 'refresh_token',
      refresh_token: a.refresh_token,
      client_id: a.client_id,
      resource: CFG.base
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.access_token) {
    throw new Error('续期失败，请重新连接 COROS');
  }
  await persist(data, a.client_id);
  return cache;
}

/* ---------- MCP 调用 ---------- */
let mcpSession = null;
let reqId = 1;

async function mcpPost(token, payload, sessionId) {
  const headers = {
    'Content-Type': 'application/json',
    'Accept': 'application/json, text/event-stream',
    'Authorization': 'Bearer ' + token
  };
  if (sessionId) headers['Mcp-Session-Id'] = sessionId;
  const res = await fetch(CFG.base + '/mcp', { method: 'POST', headers: headers, body: JSON.stringify(payload) });
  const sid = res.headers.get('Mcp-Session-Id') || res.headers.get('mcp-session-id');
  if (sid) mcpSession = sid;

  const ct = (res.headers.get('content-type') || '').toLowerCase();
  const raw = await res.text();
  if (!res.ok && ct.indexOf('event-stream') === -1) {
    throw new Error('MCP 请求失败 ' + res.status + '：' + raw.slice(0, 160));
  }
  if (ct.indexOf('event-stream') !== -1) {
    const lines = raw.split(/\r?\n/);
    for (const ln of lines) {
      if (ln.indexOf('data:') === 0) {
        const body = ln.slice(5).trim();
        if (!body) continue;
        try {
          const j = JSON.parse(body);
          if (j && (j.result !== undefined || j.error)) return j;
        } catch (e) {}
      }
    }
    throw new Error('未能解析 MCP 流式响应');
  }
  try { return JSON.parse(raw); } catch (e) { throw new Error('MCP 响应不是 JSON'); }
}

async function mcpInit(token) {
  mcpSession = null;
  const r = await mcpPost(token, {
    jsonrpc: '2.0', id: reqId++,
    method: 'initialize',
    params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'life-board', version: '1.0.0' } }
  });
  if (r.error) throw new Error('MCP 初始化失败：' + (r.error.message || ''));
  try {
    await mcpPost(token, { jsonrpc: '2.0', method: 'notifications/initialized' }, mcpSession);
  } catch (e) { /* 通知失败不致命 */ }
  return mcpSession;
}

async function listTools(token) {
  const r = await mcpPost(token, { jsonrpc: '2.0', id: reqId++, method: 'tools/list', params: {} }, mcpSession);
  if (r.error) throw new Error('获取工具列表失败：' + (r.error.message || ''));
  return (r.result && r.result.tools) || [];
}

async function callTool(token, name, args) {
  const r = await mcpPost(token, {
    jsonrpc: '2.0', id: reqId++, method: 'tools/call',
    params: { name: name, arguments: args || {} }
  }, mcpSession);
  if (r.error) throw new Error(r.error.message || 'MCP 调用失败');
  const result = r.result || {};
  if (result.structuredContent !== undefined) {
    return { kind: 'json', value: result.structuredContent,
      raw: JSON.stringify(result.structuredContent).slice(0, 400) };
  }
  let txt = '';
  const c = result.content;
  if (Array.isArray(c)) txt = c.filter(x => x && x.type === 'text').map(x => x.text).join('\n');
  else if (typeof result === 'string') txt = result;
  else return { kind: 'json', value: result, raw: JSON.stringify(result).slice(0, 400) };

  const t = txt.trim();
  // COROS 把整段报告用 JSON.stringify 包了一层，先剥掉字符串字面量外壳
  if (t.charAt(0) === '"') {
    try {
      const parsed = JSON.parse(t);
      if (typeof parsed === 'string') return { kind: 'text', value: parsed, raw: parsed.slice(0, 400) };
    } catch (e) {}
  }
  try {
    const j = JSON.parse(t);
    return { kind: 'json', value: j, raw: t.slice(0, 400) };
  } catch (e) {}
  return { kind: 'text', value: txt, raw: txt.slice(0, 400) };
}

/* ---------- 固定字段 schema ----------
   不再把嵌套数字全部扁平化（同名会互相覆盖），也不靠数值阈值猜单位。
   每类数据只从声明过的路径取值；单位必须在白名单内，结果还要落在合理区间，
   任一环节不满足就记一条诊断、该字段不写入，避免静默写错数值。 */
const UNIT_ALIAS = {
  's': 's', 'sec': 's', 'secs': 's', 'second': 's', 'seconds': 's',
  'min': 'min', 'mins': 'min', 'minute': 'min', 'minutes': 'min',
  'h': 'h', 'hr': 'h', 'hour': 'h', 'hours': 'h',
  'ms': 'ms', 'millisecond': 'ms', 'milliseconds': 'ms'
};
const TIME_FACTOR = {
  s:   { min: 1 / 60,  sec: 1 },
  min: { min: 1,       sec: 60 },
  h:   { min: 60,      sec: 3600 },
  ms:  { min: 1 / 60000, sec: 0.001 }
};
const DIST_ALIAS = { m: 'm', meter: 'm', meters: 'm', km: 'km', kilometer: 'km', kilometers: 'km', mi: 'mi', mile: 'mi' };
const DIST_FACTOR = { m: 1, km: 1000, mi: 1609.34 };
/* 单位字段按字段族分开找，避免「距离单位」被误当作「时长单位」而误报 */
const TIME_UNIT_PATHS = ['timeUnit', 'sleepUnit', 'durationUnit', 'unit', 'units'];
const DIST_UNIT_PATHS = ['distanceUnit', 'unit', 'units'];
const DATE_PATHS = ['date', 'day', 'sleepDate', 'sleep_date', 'happenDay', 'startTime', 'start_time', 'timestamp'];

/* target: min = 转成分钟（睡眠写库时再换算成小时）；sec = 转成秒；raw = 原值
   min/max 是转换后目标单位的合理区间，用于拦截单位错配 */
const SCHEMAS = {
  sleep: {
    fields: [
      { key: 'sleep_total', target: 'min', unit: 's', min: 120, max: 840,
        paths: ['sleepDuration', 'sleep_duration', 'totalSleepTime', 'total_sleep_time', 'totalSleep', 'sleepTime', 'sleepSeconds'] },
      { key: 'sleep_deep', target: 'min', unit: 's', min: 0, max: 840,
        paths: ['deepSleepDuration', 'deep_sleep_duration', 'deepSleep', 'deepSleepTime', 'sleepDeep'] },
      { key: 'sleep_rem', target: 'min', unit: 's', min: 0, max: 840,
        paths: ['remSleepDuration', 'rem_sleep_duration', 'remSleep', 'remSleepTime', 'sleepRem'] },
      { key: 'sleep_light', target: 'min', unit: 's', min: 0, max: 840,
        paths: ['lightSleepDuration', 'light_sleep_duration', 'lightSleep', 'lightSleepTime', 'sleepLight'] }
    ]
  },
  health: {
    fields: [
      { key: 'hrv', target: 'raw', unit: 'ms', min: 1, max: 300,
        paths: ['hrv', 'hrvValue', 'hrv_value', 'avgHrv', 'overnightHrv', 'rmssd', 'sdnn'] },
      { key: 'resting_hr', target: 'raw', unit: 'bpm', min: 25, max: 120,
        paths: ['restingHeartRate', 'resting_hr', 'restingHr', 'restHr', 'rhr'] },
      { key: 'stress', target: 'raw', unit: 'score', min: 0, max: 100,
        paths: ['stress', 'stressValue', 'stress_value', 'avgStress', 'stressLevel'] },
      { key: 'training_load', target: 'raw', unit: 'score', min: 0, max: 1000,
        paths: ['trainingLoad', 'training_load', 'load', 'exerciseLoad', 'tss'] },
      { key: 'steps', target: 'raw', unit: 'count', min: 0, max: 100000,
        paths: ['steps', 'step', 'totalSteps', 'step_count', 'stepCount'] }
    ]
  },
  activity: {
    fields: [
      { key: 'duration_sec', target: 'sec', unit: 's', min: 60, max: 86400,
        paths: ['duration', 'durationSeconds', 'duration_seconds', 'totalTime', 'elapsedTime', 'workoutTime'] },
      { key: 'distance_m', target: 'm', unit: 'm', min: 0, max: 1000000,
        paths: ['distance', 'distanceMeter', 'distance_m', 'totalDistance'] },
      { key: 'avg_hr', target: 'raw', unit: 'bpm', min: 25, max: 250,
        paths: ['avgHeartRate', 'averageHeartRate', 'avgHr', 'avg_hr'] },
      { key: 'calories', target: 'raw', unit: 'kcal', min: 0, max: 20000,
        paths: ['calorie', 'calories', 'kcal', 'totalCalorie'] }
    ]
  }
};

/* 精确路径读取：大小写不敏感，但绝不遍历未知字段 */
function getByPath(obj, path) {
  const parts = String(path).split('.');
  let cur = obj;
  for (const part of parts) {
    if (cur === null || typeof cur !== 'object') return undefined;
    const key = Object.keys(cur).find(k => k.toLowerCase() === part.toLowerCase());
    if (key === undefined) return undefined;
    cur = cur[key];
  }
  return cur;
}
function readField(item, def) {
  for (const path of def.paths) {
    const v = getByPath(item, path);
    if (v === null || v === undefined || v === '') continue;
    const n = Number(v);
    if (isFinite(n)) return { value: n, path: path };
  }
  return null;
}
function resolveUnit(item, def) {
  // 标量字段的单位由 schema 固定；时间/距离字段允许数据里显式声明单位，但必须在白名单内
  if (def.target === 'raw') return { unit: def.unit, explicit: false };
  for (const p of (def.target === 'm' ? DIST_UNIT_PATHS : TIME_UNIT_PATHS)) {
    const v = getByPath(item, p);
    if (v === null || v === undefined || v === '') continue;
    const t = String(v).trim().toLowerCase();
    const u = def.target === 'm' ? DIST_ALIAS[t] : UNIT_ALIAS[t];
    if (!u) return { unit: null, raw: String(v), path: p };
    return { unit: u, explicit: true };
  }
  return { unit: def.unit, explicit: false };   // 采用 schema 声明的固定单位
}
function convert(v, unit, def) {
  if (def.target === 'raw') return v;
  if (def.target === 'm') { const f = DIST_FACTOR[unit]; return f ? v * f : null; }
  const f = TIME_FACTOR[unit];
  return f ? v * f[def.target] : null;
}

function dayOf(v) {
  if (!v) return null;
  if (typeof v === 'number') {
    const d = new Date(v > 1e12 ? v : v * 1000);
    return isNaN(d) ? null : ymd(d);
  }
  const m = String(v).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
  return null;
}

function issueBucket() {
  const m = new Map();
  return {
    add(tool, field, reason, sample) {
      const k = tool + '|' + field + '|' + reason;
      const cur = m.get(k);
      if (cur) cur.count++;
      else m.set(k, { tool: tool, field: field, reason: reason, sample: sample, count: 1 });
    },
    list() { return Array.from(m.values()); }
  };
}

/* 把一个返回条目按固定 schema 映射成写库行；任何异常都落到 issues 而不是悄悄跳过 */
function mapItem(category, item, toolName, issues) {
  const schema = SCHEMAS[category];
  if (!schema || !item || typeof item !== 'object') return null;
  const row = {};
  let mapped = 0;
  for (const def of schema.fields) {
    const found = readField(item, def);
    if (!found) continue;
    const u = resolveUnit(item, def);
    if (!u.unit) {
      issues.add(toolName, def.key, '单位「' + u.raw + '」不在白名单，已跳过', String(found.value));
      continue;
    }
    const val = convert(found.value, u.unit, def);
    if (val === null || !isFinite(val) || val < def.min || val > def.max) {
      issues.add(toolName, def.key,
        '取值 ' + found.value + '（单位 ' + u.unit + '）换算后超出合理区间 ' + def.min + '–' + def.max + '，已跳过',
        found.path);
      continue;
    }
    row[def.key] = Math.round(val);
    mapped++;
  }
  if (!mapped) {
    issues.add(toolName, '(整条)', '返回结构中没有匹配的字段，已跳过。原始字段名：' +
      Object.keys(item).slice(0, 24).join(', '), '');
  }
  if (!mapped) return null;
  if (category !== 'activity') {
    for (const k of ['sleep_total', 'sleep_deep', 'sleep_rem', 'sleep_light']) {
      if (row[k] !== undefined) row[k] = Math.round(row[k] / 6) / 10;  // 分钟 → 小时
    }
  }
  let day = null;
  for (const p of DATE_PATHS) {
    day = dayOf(getByPath(item, p));
    if (day) break;
  }
  return { row: row, day: day, mapped: mapped };
}

/* ---------- 同步 ----------
   COROS 官方 MCP 返回的是给 LLM 阅读的纯文本报告（实测 2026-11），不是结构化 JSON；
   日期参数为 yyyyMMdd，报告内日期为 yyyy-MM-dd / yyyyMMdd。这里按工具名精确解析，
   每个字段都做合理区间校验；不认识的内容只记诊断，不写库。 */
const READ_TOOLS = {
  queryDailyHealthData: 'daily',
  querySleepOverview: 'sleepOverview',
  querySleepHrv: 'hrv',
  queryRestingHeartRate: 'rhr',
  queryStressLevel: 'stress',
  queryTrainingLoadAssessment: 'load',
  querySportRecords: 'sport'
};
const JSON_CATEGORY = {
  queryDailyHealthData: 'health', querySleepOverview: 'sleep',
  querySleepHrv: 'health', queryRestingHeartRate: 'health',
  queryStressLevel: 'health', queryTrainingLoadAssessment: 'health',
  querySportRecords: 'activity'
};
/* 白名单之外的工具绝不调用：create / update / upload / schedule 会改用户 COROS 数据 */

function num(s) {
  if (s === null || s === undefined || s === '') return null;
  const n = Number(String(s).replace(/,/g, '').trim());
  return isFinite(n) ? n : null;
}
function minutesOf(s) {
  if (s === null || s === undefined) return null;
  const str = String(s);
  const h = /(\d+(?:\.\d+)?)\s*h(?:our)?s?/i.exec(str);
  const m = /(\d+(?:\.\d+)?)\s*min/i.exec(str);
  if (!h && !m) return num(str);
  return (h ? Number(h[1]) * 60 : 0) + (m ? Number(m[1]) : 0);
}
function clockSeconds(s) {
  if (!s) return null;
  const parts = String(s).trim().split(':').map(Number);
  if (!parts.length || parts.some(x => !isFinite(x))) return null;
  let sec = 0;
  for (const x of parts) sec = sec * 60 + x;
  return sec;
}
function isoDay(s) {
  const t = String(s || '').trim();
  const m = /^(\d{4})-?(\d{2})-?(\d{2})$/.exec(t);
  return m ? m[1] + '-' + m[2] + '-' + m[3] : null;
}
function compactDay(s) { return String(s).replace(/-/g, ''); }
function hours(min) { return Math.round(min / 6) / 10; }
function inRange(v, lo, hi) { return v !== null && isFinite(v) && v >= lo && v <= hi; }
function grab(re, text) { const m = re.exec(text); return m ? m[1] : null; }

function parseDailyHealth(text, issues) {
  const out = [];
  const re = /---\s*(\d{8})\s*---/g;
  const marks = []; let m;
  while ((m = re.exec(text))) marks.push({ day: isoDay(m[1]), start: re.lastIndex, len: m[0].length, head: m[0] });
  for (let i = 0; i < marks.length; i++) {
    const stop = i + 1 < marks.length ? marks[i + 1].start - marks[i + 1].head.length : text.length;
    const block = text.slice(marks[i].start, stop);
    const row = {};
    const steps = num(grab(/Steps:\s*([\d,]+)/, block));
    if (inRange(steps, 0, 100000)) row.steps = Math.round(steps);
    const stress = num(grab(/Stress:\s*Avg\s*([\d,]+)/, block));
    if (inRange(stress, 0, 100)) row.stress = Math.round(stress);
    const total = minutesOf(grab(/\bTotal:\s*([^|\n]+)/i, block));
    if (inRange(total, 120, 840)) row.sleep_total = hours(total);
    const deep = minutesOf(grab(/\bDeep:\s*([^|\n]+)/i, block));
    if (inRange(deep, 0, 840)) row.sleep_deep = hours(deep);
    const light = minutesOf(grab(/\bLight:\s*([^|\n]+)/i, block));
    if (inRange(light, 0, 840)) row.sleep_light = hours(light);
    const rem = minutesOf(grab(/\bREM:\s*([^|\n]+)/i, block));
    if (inRange(rem, 0, 840)) row.sleep_rem = hours(rem);
    if (Object.keys(row).length) out.push({ day: marks[i].day, row: row });
    else issues.add('queryDailyHealthData', '(整条)', '该日报告没有可识别字段', marks[i].day);
  }
  return out;
}

function parseSleepOverview(text) {
  const out = [];
  for (const b of String(text).split(/\n\s*\n/)) {
    const dm = /^\s*(\d{4}-\d{2}-\d{2})\s*$/m.exec(b);
    if (!dm) continue;
    const main = minutesOf(grab(/Main Sleep \(asleep\):\s*([^\n]+)/, b));
    const daily = minutesOf(grab(/Daily Sleep:\s*([^\n]+)/, b));
    const total = inRange(main, 120, 840) ? main : (inRange(daily, 120, 840) ? daily : null);
    if (total === null) continue;
    const row = { sleep_total: hours(total) };
    [['sleep_deep', /Deep Sleep Ratio:\s*(\d+)\s*%/i],
     ['sleep_light', /Light Sleep Ratio:\s*(\d+)\s*%/i],
     ['sleep_rem', /REM Ratio:\s*(\d+)\s*%/i]].forEach(function (d) {
      const p = num(grab(d[1], b));
      if (inRange(p, 0, 100)) row[d[0]] = hours(total * p / 100);
    });
    out.push({ day: dm[1], row: row });
  }
  return out;
}

function parseDailyPairs(text, re, key, lo, hi) {
  const out = []; let m;
  const rx = new RegExp(re.source, re.flags.indexOf('g') >= 0 ? re.flags : re.flags + 'g');
  while ((m = rx.exec(String(text)))) {
    const day = isoDay(m[1]), v = num(m[2]);
    if (day && inRange(v, lo, hi)) out.push({ day: day, row: (function () { const r = {}; r[key] = Math.round(v); return r; })() });
  }
  return out;
}
function parseHrv(text) {
  const seg = String(text).split(/Sleep HRV Time Series/i)[0];
  return parseDailyPairs(seg, /(\d{4}-\d{2}-\d{2}):\s*\n\s*HRV Avg:\s*(\d+(?:\.\d+)?)\s*ms/i, 'hrv', 1, 300);
}
function parseRestingHr(text) {
  return parseDailyPairs(text, /(\d{4}-\d{2}-\d{2}):\s*(\d+)\s*bpm/i, 'resting_hr', 25, 120);
}
function parseStress(text) {
  return parseDailyPairs(text, /(\d{4}-\d{2}-\d{2}):\s*\n\s*Average Stress:\s*(\d+)/i, 'stress', 0, 100);
}
function parseLoad(text) {
  const out = [];
  for (const b of String(text).split(/\n\s*\n/)) {
    const dm = /^\s*(\d{4}-\d{2}-\d{2})\s*$/m.exec(b);
    const v = num(grab(/Short-Term Load:\s*(\d+)/, b));
    if (dm && inRange(v, 0, 1000)) out.push({ day: isoDay(dm[1]), row: { training_load: Math.round(v) } });
  }
  return out;
}
function parseSportRecords(text) {
  const out = [];
  const re = /^\s*\d+\.\s*(.+?)\s+—\s+(\d{4}-\d{2}-\d{2})\s*$/gm;
  const marks = []; let m;
  while ((m = re.exec(text))) marks.push({ name: m[1].trim(), day: m[2], start: re.lastIndex });
  for (let i = 0; i < marks.length; i++) {
    const b = text.slice(marks[i].start, i + 1 < marks.length ? marks[i + 1].start : text.length);
    const ext = grab(/LabelId:\s*(\S+)/, b);
    const row = {
      external_id: ext || (marks[i].day + '|' + marks[i].name),
      day: marks[i].day,
      name: marks[i].name,
      type: grab(/SportType:\s*(\S+)/, b) || null
    };
    const dur = clockSeconds(grab(/Duration:\s*([^\s|]+)/, b));
    if (inRange(dur, 60, 86400)) row.duration_sec = Math.round(dur);
    const km = num(grab(/Distance:\s*([\d.,]+)\s*km/i, b));
    if (inRange(km, 0, 1000)) row.distance_m = Math.round(km * 1000);
    const hr = num(grab(/Avg HR:\s*(\d+)\s*bpm/i, b));
    if (inRange(hr, 25, 250)) row.avg_hr = Math.round(hr);
    const kcal = num(grab(/Calories:\s*([\d,]+)\s*kcal/i, b));
    if (inRange(kcal, 0, 20000)) row.calories = Math.round(kcal);
    out.push(row);
  }
  return out;
}

function mergeHealth(map, entries, fillOnly) {
  entries.forEach(function (e) {
    if (!e.day) return;
    const cur = map[e.day] = map[e.day] || {};
    Object.keys(e.row).forEach(function (k) {
      if (!fillOnly || cur[k] === undefined) cur[k] = e.row[k];
    });
  });
}

async function sync(days) {
  if (busy) { const soft = new Error('已有同步在进行，请稍候'); soft.soft = true; throw soft; }
  busy = true;
  const n = Math.max(1, Math.min(14, days || 7));
  let phase = '准备';
  const debug = [], issues = issueBucket(), samples = [], toolsUsed = [];
  const health = {}, activities = [];
  try {
    phase = '检查授权';
    const a = await ensureFresh();
    const token = a.access_token;
    phase = '连接 COROS';
    await mcpInit(token);
    phase = '读取工具列表';
    const tools = await listTools(token);
    if (!tools.length) throw new Error('没有获取到可用的数据接口');

    const from = ymd(new Date(Date.now() - (n - 1) * 86400000));
    const to = ymd(new Date());
    const wanted = {};
    tools.forEach(function (t) { if (t && READ_TOOLS[t.name]) wanted[t.name] = t; });

    for (const nm of Object.keys(READ_TOOLS)) {
      const t = wanted[nm];
      if (!t) { debug.push(nm + ': 官方未提供，跳过'); continue; }
      const allowed = Object.keys((t.inputSchema && t.inputSchema.properties) || {});
      const cand = { days: n, startDate: compactDay(from), endDate: compactDay(to), limit: 50 };
      const args = {};
      allowed.forEach(function (k) { if (cand[k] !== undefined) args[k] = cand[k]; });
      phase = '读取 ' + nm;
      let res;
      try { res = await callTool(token, nm, args); }
      catch (e) {
        const msg = e.message || 'fail';
        debug.push(nm + ': 调用失败 ' + msg);
        issues.add(nm, '(整条)', '调用失败：' + msg, JSON.stringify(args));
        continue;
      }
      toolsUsed.push(nm);
      samples.push({ tool: nm, kind: res.kind, args: args, preview: String(res.raw || '').slice(0, 400) });

      if (res.kind === 'json') {
        // 兼容：若官方改回结构化返回，仍走固定 schema 白名单
        const category = JSON_CATEGORY[nm] || 'health';
        const v = res.value;
        const arr = Array.isArray(v) ? v
          : (v && (Array.isArray(v.data) ? v.data : Array.isArray(v.items) ? v.items : Array.isArray(v.list) ? v.list : [v]));
        let cnt = 0;
        for (const item of arr) {
          if (!item || typeof item !== 'object') continue;
          const mm = mapItem(category, item, nm, issues);
          if (!mm) continue;
          const day = mm.day || to;
          if (category === 'activity') {
            activities.push(Object.assign({
              external_id: String(item.id || item.activityId || item.labelId || (day + '|' + cnt)),
              day: day, name: item.name || item.title || null, type: item.type || item.sportType || null
            }, mm.row));
          } else mergeHealth(health, [{ day: day, row: mm.row }], false);
          cnt++;
        }
        debug.push(nm + ': JSON 路径 ' + cnt + ' 条');
        continue;
      }

      const text = String(res.value || '');
      if (/must not be blank|must be in yyyyMMdd|anomalies detected|High risk of session/i.test(text)) {
        debug.push(nm + ': 参数被拒 ' + text.slice(0, 120));
        issues.add(nm, '(整条)', '参数被官方拒绝：' + text.slice(0, 160), JSON.stringify(args));
        continue;
      }
      let entries = [], acts = [], fill = false;
      switch (READ_TOOLS[nm]) {
        case 'daily':        entries = parseDailyHealth(text, issues); break;
        case 'sleepOverview':entries = parseSleepOverview(text); fill = true; break;
        case 'hrv':          entries = parseHrv(text); break;
        case 'rhr':          entries = parseRestingHr(text); break;
        case 'stress':       entries = parseStress(text); break;
        case 'load':         entries = parseLoad(text); break;
        case 'sport':        acts = parseSportRecords(text); break;
      }
      mergeHealth(health, entries, fill);
      acts.forEach(function (r) { activities.push(r); });
      debug.push(nm + ': 解析出 ' + (entries.length || acts.length) + ' 条');
    }

    phase = '写入云端';
    const written = new Set();
    const writeErrors = [];
    // 单日/单条写入失败不应让整轮同步归零；记录诊断后继续写其余数据。
    for (const day of Object.keys(health)) {
      try {
        await window.LifeApp.upsertHealth(day, Object.assign({ source: 'coros' }, health[day]));
        written.add(day);
      } catch (e) {
        const why = String((e && e.message) || e);
        writeErrors.push(day + '：' + why);
        debug.push(day + ': 写入失败 ' + why);
        issues.add('写入云端', day, '写入失败：' + why, null);
      }
    }
    for (const row of activities) {
      try { await window.LifeApp.upsertActivity(row); }
      catch (e) {
        const why = String((e && e.message) || e);
        writeErrors.push('运动 ' + row.external_id + '：' + why);
        issues.add('写入云端', 'activity', '写入失败：' + why, null);
      }
    }
    if (Object.keys(health).length && !written.size) {
      throw new Error('全部日期写入失败：' + (writeErrors[0] || '未知原因'));
    }
    debug.push('写入 ' + written.size + ' 天身体数据 / ' + activities.length + ' 条运动' +
      (writeErrors.length ? '，其中 ' + writeErrors.length + ' 项失败' : ''));

    phase = '保存诊断';
    const warnings = issues.list();
    cache.last_sync = new Date().toISOString();
    cache.last_warnings = warnings;
    await window.LifeApp.saveKv(KV_KEY, cache);
    await window.LifeApp.saveKv('coros_last_run', {
      at: cache.last_sync, ok: true, phase: '完成', tools: toolsUsed,
      log: debug, warnings: warnings, samples: samples,
      parsed: { healthDays: written.size, activities: activities.length, days: Object.keys(health) }
    });
    return { days: written.size, activities: activities.length, warnings: warnings, tools: toolsUsed.length };
  } catch (e) {
    const msg = '[' + phase + '] ' + (e.message || '未知错误');
    try {
      await window.LifeApp.saveKv('coros_last_run', {
        at: new Date().toISOString(), ok: false, phase: phase, error: msg,
        log: debug, samples: samples, warnings: issues.list()
      });
    } catch (x) {}
    const wrapped = new Error(msg);
    wrapped.soft = !!e.soft;
    throw wrapped;
  } finally {
    busy = false;
  }
}

/* ---------- 对外 ---------- */
function status() {
  const c = cache;
  let last = '';
  if (c && c.last_sync) {
    const d = new Date(c.last_sync);
    last = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  // 令牌过期但仍有 refresh_token 时不算「已连接」到可用状态以外：ensureFresh 会自动续期
  const usable = !!(c && c.access_token && (c.refresh_token || Date.now() < (c.expires_at || 0)));
  const w = (c && c.last_warnings) || [];
  return { connected: usable, lastSync: last, warnCount: w.length };
}
function warnings() { return (cache && cache.last_warnings) || []; }

async function afterLogin() {
  await loadAuth();
  const S = window.LifeApp.S;
  if (!cache || !cache.access_token) return;
  const t = ymd(new Date());
  if (S.health[t]) return;                       // 今天已有数据
  if (cache.last_sync && (Date.now() - new Date(cache.last_sync).getTime()) < 6 * 3600 * 1000) return;
  try {
    const res = await sync(2);
    if (res.days > 0) { await window.LifeApp.loadAll(); window.LifeApp.render(); }
  } catch (e) { console.warn('[coros] auto sync skipped:', e.message); }
}

async function diagnostics() {
  try { return await window.LifeApp.getKv('coros_last_run'); } catch (e) { return null; }
}

window.Coros = {
  connect: connect, handleCallback: handleCallback, sync: sync, status: status,
  warnings: warnings, diagnostics: diagnostics, afterLogin: afterLogin,
  mapItem: mapItem, issueBucket: issueBucket, SCHEMAS: SCHEMAS, READ_TOOLS: READ_TOOLS,
  parseDailyHealth: parseDailyHealth, parseSleepOverview: parseSleepOverview,
  parseHrv: parseHrv, parseRestingHr: parseRestingHr, parseStress: parseStress,
  parseLoad: parseLoad, parseSportRecords: parseSportRecords,
  minutesOf: minutesOf, clockSeconds: clockSeconds
};
})();

</script>
<script>
/* 微信读书粘贴解析：把复制出来的划线文本拆成 书名 / 作者 / 章节 / 划线 */
(function () {
'use strict';

const NOISE = [
  /^来自\s*微信读书/,
  /^微信读书/,
  /^——\s*摘自/,
  /^--\s*摘自/,
  /^摘自《/,
  /^第\s*\d+\s*页/,
  /^\d+\s*\/\s*\d+$/,
  /^位置\s*\d+/,
  /^本章完$/,
  /^完$/,
  /^\.{3,}$/,
  /^-{3,}$/
];

function clean(s) {
  return String(s)
    .replace(/\u00a0/g, ' ')
    .replace(/[ \t]+/g, ' ')
    .trim();
}

function isNoise(line) {
  return NOISE.some(re => re.test(line));
}

function looksLikeHeading(line) {
  if (!line) return false;
  if (/^第[一二三四五六七八九十百千0-9]+\s*[章节篇回]/.test(line)) return true;
  if (/^#{1,3}\s+/.test(line)) return true;
  if (/^[【\[]/.test(line) && line.length < 24 && /[】\]]$/.test(line)) return true;
  // 短且无句末标点，多半是章节名
  if (line.length <= 14 && !/[。！？；，、,.!?;:]$/.test(line) && !/[。！？]/.test(line)) return true;
  return false;
}

function splitTitle(line) {
  // 《书名》 作者   /  《书名》
  let m = line.match(/^《(.+?)》\s*(.*)$/);
  if (m) return { title: m[1].trim(), author: (m[2] || '').replace(/^[-—·\s]+/, '').trim() };
  // 书名 - 作者 / 书名 — 作者 / 书名 | 作者
  m = line.match(/^(.+?)\s*[-—–|·]{1,2}\s*(.+)$/);
  if (m && m[1].length <= 40) return { title: m[1].trim(), author: m[2].trim() };
  return { title: line.trim(), author: '' };
}

function parse(raw) {
  const lines = String(raw || '')
    .split(/\r?\n/)
    .map(clean)
    .filter(l => l && !isNoise(l));

  const out = { title: '', author: '', notes: [] };
  if (!lines.length) return out;

  let i = 0;

  // 1) 末尾的「——摘自《书名》」优先作为书名来源
  for (let k = lines.length - 1; k >= 0; k--) {
    const m = lines[k].match(/摘自《(.+?)》/);
    if (m) { out.title = m[1].trim(); lines.splice(k, 1); break; }
  }

  // 2) 第一行是标题行？（书名号或破折号是强信号，优先于章节判断）
  if (!out.title && lines.length > 1) {
    const first = lines[0];
    const isBookMark = /^《.+?》/.test(first);
    const isDashTitle = /^(.{1,40}?)\s*[-—–]{1,2}\s*\S/.test(first) && !/[。！？]$/.test(first);
    if (isBookMark || isDashTitle) {
      const t = splitTitle(first);
      out.title = t.title;
      out.author = t.author;
      i = 1;
    }
  } else if (out.title) {
    i = 0;
  }

  // 3) 余下逐行归档
  let chapter = '';
  for (; i < lines.length; i++) {
    const line = lines[i];
    if (looksLikeHeading(line) && line.length <= 40) {
      chapter = line.replace(/^#{1,3}\s+/, '').trim();
      continue;
    }
    // 单行里可能塞了多句，超过 240 字就按句号拆
    if (line.length > 240) {
      line.split(/(?<=[。！？])/).map(clean).filter(Boolean).forEach(t => {
        out.notes.push({ chapter: chapter, text: t });
      });
    } else {
      out.notes.push({ chapter: chapter, text: line });
    }
  }

  // 4) 若第一条其实是书名行（因为只有一个书名 + 若干划线）
  if (!out.title && out.notes.length) {
    out.title = '未命名书籍';
  }

  return out;
}

window.Weread = { parse: parse };
})();

/* ==================== 离线快照 / 骨架屏 ==================== */
const SNAP_KEY = 'lb.snapshot.v1';

function saveSnapshot() {

const T = () => (window.__t || 0);

/* 所有从 DB 取回的实体统一把 id / 外键转成字符串，杜绝 number vs string 的 === 失配 */
function normRow(r) {
  if (!r || typeof r !== 'object') return r;
  const o = Object.assign({}, r);
  ['id', 'habit_id', 'book_id', 'plan_id'].forEach(k => {
    if (o[k] !== null && o[k] !== undefined) o[k] = String(o[k]);
  });
  return o;
}
const normRows = rows => (rows || []).map(normRow);

async function loadAll() {
  if (!DB) throw new Error('云服务未就绪');
  const since = dayKey(addDays(new Date(), -400));
  const [habits, checkins, health, acts, books, notes, plans, logs] = await Promise.all([
    q(DB.from('habits').select('*').order('sort_order').order('id')),
    q(DB.from('checkins').select('habit_id,day').gte('day', since)),
    q(DB.from('health_daily').select('*').gte('day', since).order('day')),

  S.habits = normRows(habits);

  });

  (health || []).forEach(r => { S.health[String(r.day).slice(0, 10)] = r; });
  S.activities = normRows(acts);
  S.books = normRows(books);
  S.notes = normRows(notes);
  S.plans = normRows(plans);
  S.logs = normRows(logs);
  bump();
}

/* 当日有效习惯快照：用 created_at / archived_at 还原当天实际存在的习惯，
   增删习惯不再改写历史热力图、趋势与相关系数。 */
function activeHabits() { return S.habits.filter(h => !h.archived); }
function activeBooks() { return S.books.filter(b => !b.deleted_at); }
function activeNotes() { return S.notes.filter(n => !n.deleted_at); }
function activePlans() { return S.plans.filter(p => !p.archived && !p.deleted_at); }
function dayEndTs(day) { return new Date(day + 'T23:59:59').getTime(); }
function habitsForDay(day) {
  const t = dayEndTs(day);
  return S.habits.filter(h => {
    const born = h.created_at ? new Date(h.created_at).getTime() : 0;
    if (born > t) return false;
    if (h.archived) {
      const gone = h.archived_at ? new Date(h.archived_at).getTime() : 0;
      if (gone <= t) return false;
    }
    return true;
  });
}
function isDone(habitId, day) {
  const m = S.checkins[day];
  return !!(m && m[String(habitId)]);
}
function dayEntries(day) { return habitsForDay(day).length; }
function doneCount(day) {
  return habitsForDay(day).reduce((n, h) => n + (isDone(h.id, day) ? 1 : 0), 0);
}
function rateOfDay(day) {
  const n = dayEntries(day);
  return n ? doneCount(day) / n : null;   // 当天没有有效习惯 = 无数据，不是 0%
}
function hasCheckins(day) {
  const m = S.checkins[day];
  return !!(m && Object.keys(m).length);
}

async function toggleCheckin(habitId, day) {
  const on = isDone(habitId, day);
  const m = S.checkins[day] = S.checkins[day] || {};
  if (on) delete m[String(habitId)]; else m[String(habitId)] = true;
  render();
  try {
    if (on) {
      await q(DB.from('checkins').delete().eq('habit_id', dbId(habitId)).eq('day', day).select());
    } else {
      await q(DB.from('checkins').insert({ habit_id: dbId(habitId), day: day }).select());
    }
  } catch (e) {
    // 回滚
    if (on) m[String(habitId)] = true; else delete m[String(habitId)];
    render();
    toast('保存失败：' + (e.message || '网络异常'));
  }
}

async function saveHabit(payload, id) {
  if (id != null && id !== '') {
    const rows = normRows(await q(DB.from('habits').update(payload).eq('id', dbId(id)).select()));
    if (!rows.length) throw new Error('未能更新该打卡项');
    const i = S.habits.findIndex(h => eqId(h.id, id));
    if (i >= 0) S.habits[i] = Object.assign(S.habits[i], rows[0]);
  } else {
    const rows = normRows(await q(DB.from('habits').insert(payload).select()));
    if (!rows.length) throw new Error('未能创建打卡项');
    S.habits.push(rows[0]);
  }
  render();
}

/* 软删除：保留习惯与其历史打卡，历史完成率才不会因删项而被改写 */
async function removeHabit(id) {
  const at = new Date().toISOString();
  const rows = normRows(await q(DB.from('habits').update({ archived: true, archived_at: at }).eq('id', dbId(id)).select()));
  const h = S.habits.find(x => eqId(x.id, id));
  if (h) { h.archived = true; h.archived_at = at; }
  else if (rows[0]) S.habits.push(rows[0]);
  render();
}

async function saveBook(payload) {
  const rows = normRows(await q(DB.from('books').insert(payload).select()));
  if (!rows.length) throw new Error('未能添加书籍');
  S.books.unshift(rows[0]);
  render();
  return rows[0];
}
/* 软删除：书籍与它的划线共用一个时间戳，恢复时能精确还原这一批 */
async function removeBook(id) {
  const at = new Date().toISOString();
  await q(DB.from('books').update({ deleted_at: at }).eq('id', dbId(id)).select());
  // 只按 id 逐条更新：避免依赖 SDK 对 eq(col, null) / is() 的支持差异
  const noteIds = S.notes.filter(n => eqId(n.book_id, id) && !n.deleted_at).map(n => n.id);
  for (const nid of noteIds) await q(DB.from('notes').update({ deleted_at: at }).eq('id', dbId(nid)).select());
  const b = S.books.find(x => eqId(x.id, id));
  if (b) b.deleted_at = at;
  S.notes.forEach(n => { if (eqId(n.book_id, id) && !n.deleted_at) n.deleted_at = at; });
  render();
}
async function patchBook(id, payload) {
  const rows = normRows(await q(DB.from('books').update(payload).eq('id', dbId(id)).select()));
  if (!rows.length) throw new Error('未能更新书籍');
  const i = S.books.findIndex(b => eqId(b.id, id));
  if (i >= 0) Object.assign(S.books[i], rows[0]);
  render();
}

/* 逐条写入：DB 侧 (owner_id, book_id, md5(content)) 唯一索引兜底，
   同一次粘贴里的重复、以及重复导入都会被跳过而不是静默造重复数据。 */
async function addNotes(list) {
  let added = 0, skipped = 0;
  for (const row of list) {
    if (S.notes.some(n => !n.deleted_at && eqId(n.book_id, row.book_id) && n.content === row.content)) { skipped++; continue; }
    try {
      const rows = normRows(await q(DB.from('notes').insert(row).select()));
      if (rows[0]) { S.notes.push(rows[0]); added++; } else skipped++;
    } catch (e) {
      if (/duplicate|unique|23505|conflict/i.test(e.message || '')) skipped++;
      else throw e;
    }
  }
  render();
  return { added: added, skipped: skipped };
}
async function removeNote(id) {
  const at = new Date().toISOString();
  await q(DB.from('notes').update({ deleted_at: at }).eq('id', dbId(id)).select());
  const n = S.notes.find(x => eqId(x.id, id));
  if (n) n.deleted_at = at;
  render();
}

async function savePlan(payload) {
  const rows = normRows(await q(DB.from('study_plans').insert(payload).select()));
  if (!rows.length) throw new Error('未能创建计划');
  S.plans.push(rows[0]); render();
}
async function removePlan(id) {
  const at = new Date().toISOString();
  await q(DB.from('study_plans').update({ deleted_at: at }).eq('id', dbId(id)).select());
  const p = S.plans.find(x => eqId(x.id, id));
  if (p) p.deleted_at = at;
  render();
}
function loggedToday(planId, day) {
  const d = day || TODAY();
  return S.logs.some(l => eqId(l.plan_id, planId) && String(l.day).slice(0, 10) === d);
}
/* 每天每个计划只记一次：前端拦截连点，DB 侧 (owner_id, plan_id, day) 唯一索引兜底 */
async function logStudy(planId) {
  const today = TODAY();
  if (loggedToday(planId, today)) { toast('今天已经记过一次了'); return false; }
  let rows;
  try {
    rows = normRows(await q(DB.from('study_logs').insert({ plan_id: dbId(planId), day: today }).select()));
  } catch (e) {
    if (/duplicate|unique|23505|conflict/i.test(e.message || '')) { toast('今天已经记过一次了'); return false; }
    throw e;
  }
  if (!rows.length) throw new Error('未能记录');
  S.logs.unshift(rows[0]);
  render();
  toast('已记录一次');
  return true;
}

/* 幂等写入：DB 的 day 是 date 列，经 SDK 返回 ISO 串（2026-11-08T00:00:00Z），
   用 .eq('day','2026-11-08') 查不到已有行，重复同步会 INSERT 撞 (owner_id, day) 唯一键。
   因此优先用 loadAll 已读入内存的 id；没有则无条件拉表、在 JS 侧按前 10 位匹配；
   INSERT 仍撞唯一键时再查一次改 UPDATE，绝不因重复同步中断整轮。 */
function isDupError(e) {
  const s = String((e && (e.message || e.details || e.hint)) || e || '').toLowerCase();
  return s.indexOf('duplicate') >= 0 || s.indexOf('unique constraint') >= 0 || s.indexOf('23505') >= 0;
}
async function findRowId(table, col, val, len) {
  const rows = await q(DB.from(table).select('id,' + col));
  const hit = (rows || []).find(r => String(r[col]).slice(0, len || 10) === val);
  return hit ? dbId(hit.id) : null;
}
async function patchById(table, id, payload) {
  await q(DB.from(table).update(payload).eq('id', id).select());
}

async function upsertHealth(day, patch) {
  const clean = {};
  Object.keys(patch || {}).forEach(k => { if (patch[k] !== null && patch[k] !== undefined) clean[k] = patch[k]; });
  if (!Object.keys(clean).length) return;
  const cur = S.health[day];
  let id = cur && cur.id !== null && cur.id !== undefined ? dbId(cur.id) : null;
  if (id === null) id = await findRowId('health_daily', 'day', day, 10);
  const payload = Object.assign({}, clean, { updated_at: new Date().toISOString() });
  if (id !== null) {
    await patchById('health_daily', id, payload);
  } else {
    try {
      const rows = await q(DB.from('health_daily').insert(Object.assign({ day: day }, clean)).select());
      if (rows && rows[0]) id = dbId(rows[0].id);
    } catch (e) {
      if (!isDupError(e)) throw e;
      const again = await findRowId('health_daily', 'day', day, 10);
      if (again !== null) { id = again; await patchById('health_daily', id, payload); }
      else await q(DB.from('health_daily').update(payload).eq('day', day).select());
    }
  }
  S.health[day] = Object.assign(S.health[day] || { day: day }, clean, id !== null ? { id: String(id) } : {});
}

async function upsertActivity(row) {
  if (!row || !row.external_id) return;
  const ext = String(row.external_id);
  let cur = (S.activities || []).find(a => String(a.external_id) === ext);
  let id = cur && cur.id !== null && cur.id !== undefined ? dbId(cur.id) : null;
  if (id === null) {
    const rows = await q(DB.from('activities').select('id,external_id'));
    const hit = (rows || []).find(r => String(r.external_id) === ext);
    if (hit) id = dbId(hit.id);
  }
  if (id !== null) {
    await patchById('activities', id, row);
    if (cur) Object.assign(cur, row);
    return;
  }
  try {
    const rows = await q(DB.from('activities').insert(row).select());
    const saved = rows && rows[0] ? normRow(rows[0]) : null;
    if (saved) S.activities.push(saved);
  } catch (e) {
    if (!isDupError(e)) throw e;
    const rows = await q(DB.from('activities').select('id,external_id'));
    const hit = (rows || []).find(r => String(r.external_id) === ext);
    if (hit) { const rid = dbId(hit.id); await patchById('activities', rid, row); S.activities.push(normRow(Object.assign({ id: rid }, row))); }
    else await q(DB.from('activities').update(row).eq('external_id', ext).select());
  }
}

async function kvGet(k) {
  const rows = await q(DB.from('app_kv').select('*').eq('k', k).limit(1));
  return rows && rows[0] ? rows[0].v : null;
}
async function kvSet(k, v) {
  const rows = await q(DB.from('app_kv').select('id').eq('k', k).limit(1));
  if (rows && rows[0]) {
    await q(DB.from('app_kv').update({ v: v, updated_at: new Date().toISOString() }).eq('id', rows[0].id).select());
  } else {
    await q(DB.from('app_kv').insert({ k: k, v: v }).select());
  }
}
async function kvDel(k) {
  await q(DB.from('app_kv').delete().eq('k', k).select());
}

async function restoreRow(kind, id) {
  if (kind === 'habit') {
    await q(DB.from('habits').update({ archived: false, archived_at: null }).eq('id', dbId(id)).select());
    const h = S.habits.find(x => eqId(x.id, id));
    if (h) { h.archived = false; h.archived_at = null; }
  } else if (kind === 'book') {
    const b = S.books.find(x => eqId(x.id, id));
    const stamp = b ? b.deleted_at : null;
    await q(DB.from('books').update({ deleted_at: null }).eq('id', dbId(id)).select());
    if (b) {
      b.deleted_at = null;
      const ids = S.notes.filter(n => eqId(n.book_id, id) && stamp && n.deleted_at === stamp).map(n => n.id);
      for (const nid of ids) await q(DB.from('notes').update({ deleted_at: null }).eq('id', dbId(nid)).select());
      S.notes.forEach(n => { if (eqId(n.book_id, id) && stamp && n.deleted_at === stamp) n.deleted_at = null; });
    }
  } else if (kind === 'note' || kind === 'plan') {
    const t = kind === 'note' ? 'notes' : 'study_plans';
    await q(DB.from(t).update({ deleted_at: null }).eq('id', dbId(id)).select());
    const row = (kind === 'note' ? S.notes : S.plans).find(x => eqId(x.id, id));
    if (row) row.deleted_at = null;
  }
  render();
}
function fmtStamp(v) {
  if (!v) return '';

  if (isNaN(d.getTime())) return '';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

const BACKUP_TABLES = ['habits', 'checkins', 'health_daily', 'activities', 'books',
  'notes', 'study_plans', 'study_logs', 'app_kv'];
async function fetchBackupRows() {
  if (S.offline) {

    });

      activities: S.activities, books: S.books, notes: S.notes,
      study_plans: S.plans, study_logs: S.logs, app_kv: []
    };
  }
  const out = {};
  for (const t of BACKUP_TABLES) {
    const rows = normRows(await q(DB.from(t).select('*')));
    // COROS 令牌属于凭据，不写进备份文件
    out[t] = t === 'app_kv' ? rows.filter(r => !/^coros/i.test(String(r.k))) : rows;
  }
  return out;
}
async function exportBackup() {
  const tables = await fetchBackupRows();
  const payload = { app: 'life-dashboard', version: 1, exported_at: new Date().toISOString(), tables: tables };
  const json = JSON.stringify(payload, null, 2);
  const name = '生活记录备份-' + TODAY() + '.json';
  try {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);

  try { localStorage.setItem('lb.last_export', new Date().toISOString()); } catch (e) {}
  toast('已导出备份（不含 COROS 授权令牌）');
  return { name: name, json: json, tables: tables };
}
/* 合并式恢复：已存在的行只补齐软删除状态，缺失的行按外键映射后追加；绝不覆盖现有数据 */
async function restoreBackup(payload) {
  if (!payload || payload.app !== 'life-dashboard' || !payload.tables) throw new Error('不是有效的备份文件');
  const order = ['habits', 'books', 'study_plans', 'health_daily', 'activities',
    'checkins', 'notes', 'study_logs', 'app_kv'];
  const fk = { checkins: ['habit_id', 'habits'], notes: ['book_id', 'books'], study_logs: ['plan_id', 'study_plans'] };
  const idMap = {}; order.forEach(t => { idMap[t] = {}; });
  let added = 0, restored = 0, skipped = 0;
  for (const t of order) {
    let cur = [];
    try { cur = normRows(await q(DB.from(t).select('*'))); } catch (e) { continue; }
    const byId = new Map(cur.map(r => [String(r.id), r]));
    for (const raw of (payload.tables[t] || [])) {
      const oldId = String(raw.id);
      const exist = byId.get(oldId);
      if (exist) {
        idMap[t][oldId] = dbId(exist.id);
        const revive = {};
        if (exist.deleted_at && !raw.deleted_at) revive.deleted_at = null;
        if (exist.archived && !raw.archived) { revive.archived = false; revive.archived_at = null; }
        if (Object.keys(revive).length) {
          try { await q(DB.from(t).update(revive).eq('id', dbId(exist.id)).select()); restored++; }
          catch (e) { skipped++; }
        } else skipped++;
        continue;
      }
      const row = Object.assign({}, raw);
      delete row.id; delete row.owner_id;
      if (fk[t]) {
        const mapped = idMap[fk[t][1]][String(row[fk[t][0]])];
        if (mapped === undefined) { skipped++; continue; }
        row[fk[t][0]] = mapped;
      }
      if (t === 'app_kv' &&
          (/^coros/i.test(String(row.k)) || cur.some(r => String(r.k) === String(row.k)))) { skipped++; continue; }
      try {
        const ins = normRows(await q(DB.from(t).insert(row).select()));
        if (ins[0]) { idMap[t][oldId] = dbId(ins[0].id); cur.push(ins[0]); added++; }
        else skipped++;
      } catch (e) { skipped++; }
    }
  }
  await loadAll(); saveSnapshot(); render();
  return { added: added, restored: restored, skipped: skipped };
}

function ringHTML(pct, done, total) {
  const r = 32, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, pct)));
  const col = pct >= 1 ? 'var(--green)' : 'var(--blue)';
  return '<div class="ring"><svg width="78" height="78" viewBox="0 0 78 78">' +
    '<circle cx="39" cy="39" r="' + r + '" fill="none" stroke="var(--fill)" stroke-width="7"/>' +
    '<circle cx="39" cy="39" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="7" stroke-linecap="round" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" style="transition:stroke-dashoffset .35s"/>' +
    '</svg><div class="val"><b>' + done + '</b><i>/ ' + total + '</i></div></div>';
}

  ['#1E3A8A', '#3B82F6'], ['#7C2D12', '#EA580C'], ['#134E4A', '#14B8A6'],
  ['#4C1D95', '#8B5CF6'], ['#831843', '#EC4899'], ['#1F2937', '#6B7280'],

function coverOf(b) {
  if (b.cover_a && b.cover_b) return [b.cover_a, b.cover_b];

  return COVER_PAIRS[hsum % COVER_PAIRS.length];
}

function levelOf(day) {
  const p = rateOfDay(day);              // 按当日有效习惯快照，不随增删习惯漂移
  if (p === null || p <= 0) return 0;
  if (p >= 1) return 4;
  if (p >= 0.7) return 3;
  if (p >= 0.4) return 2;
  return 1;
}

function renderCalendar() {
  const m = S.calMonth;
  const y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y, mo, 1);
  const start = addDays(first, -first.getDay());
  const rows = Math.ceil((first.getDay() + new Date(y, mo + 1, 0).getDate()) / 7);

  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i);
    const k = dayKey(d);
    const out = d.getMonth() !== mo;
    const lv = levelOf(k);
    const cls = ['cal-cell'];
    if (out) cls.push('out');
    if (lv) cls.push('l' + lv);
    if (k === TODAY()) cls.push('today');
    if (k === S.selDay) cls.push('sel');
    cells += '<div class="' + cls.join(' ') + '" data-act="calday" data-id="' + k + '">' + d.getDate() + '</div>';
  }

  const monthDays = [];
  for (let d = 1; d <= new Date(y, mo + 1, 0).getDate(); d++) monthDays.push(dayKey(new Date(y, mo, d)));
  const fullDays = monthDays.filter(k => levelOf(k) === 4).length;
  const anyDays = monthDays.filter(k => levelOf(k) > 0).length;

  let html = '<div class="head"><div class="date">完成 ' + fullDays + ' 天 · 有记录 ' + anyDays + ' 天</div><h2>日历</h2></div>';

  html += '<div class="cal"><div class="cal-top"><div class="m">' + y + ' 年 ' + (mo + 1) + ' 月</div>' +
    '<div class="cal-nav"><button data-act="calprev">' + icon('left', 17) + '</button>' +
    '<button data-act="calnext">' + icon('chev', 17) + '</button></div></div>' +
    '<div class="wk">' + WK.map(w => '<div>' + w + '</div>').join('') + '</div>' +
    '<div class="grid">' + cells + '</div>' +
    '<div class="legend"><span>少</span><i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i>' +
    '<i style="background:var(--heat-3)"></i><i style="background:var(--blue)"></i><span>多</span></div></div>';

  const sd = parseDay(S.selDay);
  const dn = doneCount(S.selDay);
  html += '<div class="gtitle">' + (sd.getMonth() + 1) + '月' + sd.getDate() + '日 周' + WK[sd.getDay()] +
    ' · 完成 ' + dn + '/' + dayEntries(S.selDay) + '</div>';
  if (!dayEntries(S.selDay)) {
    html += '<div class="card"><div class="empty">这一天还没有打卡项</div></div>';
  } else {
    html += '<div class="card">' + habitsForDay(S.selDay).map(h =>
      '<div class="lrow' + (isDone(h.id, S.selDay) ? ' done' : '') + '" data-act="daytoggle" data-id="' + h.id + '" data-day="' + S.selDay + '">' +
      '<div class="licon" style="background:' + esc(h.color) + '">' + icon(h.icon || 'circle', 17) + '</div>' +
      '<div class="lbody"><div class="lrow-t">' + esc(h.name) + '</div>' +

      '<div class="chk' + (isDone(h.id, S.selDay) ? ' on' : '') + '">' + (isDone(h.id, S.selDay) ? icon('check', 15) : '') + '</div>' +
      '</div>').join('') + '</div>';
    html += '<div class="gfoot">点任意一项可补录或取消该天的记录。</div>';
  }
